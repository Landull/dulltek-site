<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dulltek — coming soon</title>
<meta name="description" content="dulltek is rebuilding. Something new is coming.">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0b0c0e;
    --fg: #e8e8ea;
    --muted: #8a8d94;
    --accent: #3ddc97;
    --line: #1f2228;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: center;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: rgba(11, 12, 14, 0.92);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 40px 32px;
  }
  .brand {
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand span { color: var(--accent); }
  .prompt {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.7;
  }
  .prompt b { color: var(--accent); font-weight: 400; }
  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    background: var(--accent);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  h1 {
    margin-top: 20px;
    font-size: 1.15rem;
    font-weight: 600;
  }
  footer {
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <div class="brand">dull<span>tek</span></div>
  <p class="prompt"><b>$</b> status dulltek.com<br>&gt; rebuilding…</p>
  <h1>Something new is coming.<span class="cursor" aria-hidden="true"></span></h1>
  <footer>&copy; <span id="y">2026</span> dulltek</footer>
</main>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
